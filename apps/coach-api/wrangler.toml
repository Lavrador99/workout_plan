# Coach sync API — Cloudflare Workers + D1 (free plan).
# First deploy: `npm run deploy:api` from the repo root fills in database_id.
name = "coach-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "coach-db"
database_id = "990700a1-b4e9-40d4-b3ca-2b6cb441a2dd"
migrations_dir = "migrations"
